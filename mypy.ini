[mypy]
python_version = 3.10
show_error_codes = True
show_column_numbers = True

# Catch real bugs without requiring full annotation coverage
warn_unused_configs = True
warn_redundant_casts = True
warn_no_return = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True

# Third-party stubs
[mypy-typer.*]
ignore_missing_imports = True

[mypy-rich.*]
ignore_missing_imports = True

[mypy-colorama.*]
ignore_missing_imports = True

[mypy-hypothesis.*]
ignore_missing_imports = True

# Complex internal modules — type annotations are a future task
[mypy-kemlang.interpreter]
ignore_errors = True

[mypy-kemlang.parser]
ignore_errors = True
